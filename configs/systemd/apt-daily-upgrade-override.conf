# /etc/systemd/system/apt-daily-upgrade.service.d/override.conf
# Cree avec : sudo systemctl edit apt-daily-upgrade.service
# Une valeur vide annule la condition "sur secteur" du fichier d'origine :
# un serveur doit appliquer ses correctifs meme si l'hyperviseur signale une batterie.
[Unit]
ConditionACPower=
