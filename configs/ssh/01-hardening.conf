# /etc/ssh/sshd_config.d/01-hardening.conf
# "01-" prefix: for sshd, the first value read wins.
# Always test before restarting: sudo sshd -t && sudo systemctl restart ssh
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers user
MaxAuthTries 3
X11Forwarding no
