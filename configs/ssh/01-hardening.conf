# /etc/ssh/sshd_config.d/01-hardening.conf
# Prefixe 01- : pour sshd, la premiere valeur lue l'emporte.
# Toujours tester avant de redemarrer : sudo sshd -t && sudo systemctl restart ssh
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers user
MaxAuthTries 3
X11Forwarding no
